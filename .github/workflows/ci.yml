name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  director:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: director
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: director/package-lock.json
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run build
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==1.26.4 scipy
      - run: python -m unittest discover -s tests -v
